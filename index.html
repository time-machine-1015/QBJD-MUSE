<script>
/* ============================================================
 * 回忆收集站（登录后主界面）
 * 一、IndexedDB 本机存储：照片 Blob + 故事文本
 * 二、毛玻璃卡片回忆墙：上传 / 编辑故事 / 删除（二次确认）
 * 三、回忆查看器：照片碎成 3D 粒子飞散，故事逐行浮现
 * ============================================================ */
const $ = (id) => document.getElementById(id);

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

/* ---------- 一、IndexedDB 存储 ---------- */
const memDB = (() => {
  const NAME = "qbjd-muse-memories", STORE = "memories";
  let dbPromise = null;
  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(STORE)) {
          req.result.createObjectStore(STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  function run(mode, fn) {
    return open().then((db) => new Promise((resolve, reject) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      t.oncomplete = () => resolve(req ? req.result : undefined);
      t.onerror = () => reject(t.error);
    }));
  }
  return {
    all: () => run("readonly", (s) => s.getAll()),
    put: (rec) => run("readwrite", (s) => s.put(rec)),
    del: (id) => run("readwrite", (s) => s.delete(id)),
  };
})();

/* ============================================================
 * 共享模式：数据全部存在 GitHub 仓库（照片 + 记录 + 点赞 + 评论）
 * 读取 = 同源静态 JSON（快且稳，无需 token）；写入 = GitHub Contents API（需 token）
 * 不再依赖 Supabase（境外服务器在国内网络下时断时续）
 * ============================================================ */
const CLOUD = {
  GH_OWNER: "time-machine-1015",
  GH_REPO: "QBJD-MUSE",
  GH_BRANCH: "main",
  GH_TOKEN: "",   /* ← GitHub Token（仅本仓库 Contents 读写权限），填入后点赞/评论/上传生效 */
};
const remoteMode = () => !!CLOUD.GH_TOKEN;

/* 同源读取 JSON（公开静态文件，无需 token）；失败返回 fallback */
async function ghReadJSON(path, fallback) {
  try {
    const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (_) { return fallback; }
}

function ghHeaders() {
  return {
    Authorization: "Bearer " + CLOUD.GH_TOKEN,
    Accept: "application/vnd.github+json",
    "Content-Type": "application/json",
  };
}

/* UTF-8 → base64（分块避免栈溢出） */
function ghB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function ghB64Bytes(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* Contents API 写文本/二进制文件；带 sha 时为更新，否则新建；自动重试 2 次 */
async function ghPutFile(path, contentB64, message) {
  const api = `https://api.github.com/repos/${CLOUD.GH_OWNER}/${CLOUD.GH_REPO}/contents/${path}`;
  let lastErr = null;
  for (let i = 0; i < 3; i++) {
    try {
      let sha;
      try {
        const meta = await fetch(api + "?ref=" + CLOUD.GH_BRANCH, { headers: ghHeaders() }).then((r) => r.json());
        if (meta && meta.sha) sha = meta.sha;
      } catch (_) {}
      const res = await fetch(api, {
        method: "PUT",
        headers: ghHeaders(),
        body: JSON.stringify({ message: message || ("update " + path), branch: CLOUD.GH_BRANCH, content: contentB64, ...(sha ? { sha } : {}) }),
      });
      if (!res.ok) throw new Error("GitHub 写入失败 (" + res.status + ")");
      return await res.json();
    } catch (err) {
      lastErr = err;
      if (i < 2) await new Promise((r) => setTimeout(r, 1500 * (i + 1)));
    }
  }
  throw lastErr;
}

const ghWriteText = (path, obj, message) => ghPutFile(path, ghB64(JSON.stringify(obj, null, 2)), message);

/* 访客标识：跟当前登录名走（换账号登录 = 换身份，点赞/评论按人隔离）
   未登录时回退设备 UUID（兼容旧数据）；账号在任何设备登录都是同一个人 */
const DEVICE_VISITOR = (() => {
  try {
    let v = localStorage.getItem("muse_visitor");
    if (!v) {
      v = (crypto.randomUUID ? crypto.randomUUID() : "v" + Date.now() + Math.random().toString(36).slice(2));
      localStorage.setItem("muse_visitor", v);
    }
    return v;
  } catch (_) { return "local-" + Date.now(); }
})();
/* 点赞标识：登录名（小写）；旧 UUID 点过的赞在新账号下视为未点赞 */
const currentVisitor = () => {
  const name = currentUserName();
  return name ? "user:" + name.toLowerCase() : DEVICE_VISITOR;
};
/* 当前登录名（原样大小写，用作评论/上传署名；SESSION_KEY 在登录层定义） */
const currentUserName = () => {
  try { return (sessionStorage.getItem("muse_user") || "").trim(); } catch (_) { return ""; }
};

const storageUrl = (path) => `https://mjznyjsetuhklrklajem.supabase.co/storage/v1/object/public/photos/${path}`;   /* 旧图回退源 */

/* 共享密码校验（data/settings.json，可在 GitHub 网页上直接改） */
async function checkPasscode(pwd) {
  const s = await ghReadJSON("data/settings.json", null);
  return !!s && s.passcode === pwd;
}

/* 登录名单校验：名字必须在 data/settings.json 的 users 名单里（存小写，界面忽略大小写）
   返回：ok 在名单 | not-in-list 不在 | uninitialized 名单为空 | error 读取失败 */
async function checkAllowedName(name) {
  const s = await ghReadJSON("data/settings.json", null);
  if (!s) return "error";
  if (!s.users || !s.users.length) return "uninitialized";
  return s.users.includes(name.toLowerCase()) ? "ok" : "not-in-list";
}

/* 共享读取：memories + likes + comments 三个 JSON，内存拼接（同源读取，快且稳） */
async function loadMemoriesRemote() {
  const [mem, likes, comments] = await Promise.all([
    ghReadJSON("data/memories.json", null),
    ghReadJSON("data/likes.json", []),
    ghReadJSON("data/comments.json", []),
  ]);
  if (!mem) throw new Error("数据加载失败，请检查网络");
  const lk = Array.isArray(likes) ? likes : [];
  const cm = Array.isArray(comments) ? comments : [];
  const likeCount = (id) => lk.filter((l) => l.memory_id === id).length;
  const likedSet = new Set(lk.filter((l) => l.visitor === currentVisitor()).map((l) => l.memory_id));
  const cmtsMap = new Map();
  cm.forEach((c) => {
    const key = String(c.memory_id);
    if (!cmtsMap.has(key)) cmtsMap.set(key, []);
    cmtsMap.get(key).push({ id: c.id, author: c.author || "", text: c.text || "", createdAt: c.createdAt || +new Date() });
  });
  memories = (Array.isArray(mem) ? mem : []).map((r) => ({
    id: r.id,
    createdAt: r.createdAt,
    story: r.story || "",
    author: r.author || "",
    season: r.season,
    likes: likeCount(r.id), /* 计数始终从 likes.json 实时计算，与写入口径一致，避免刷新后归零 */
    liked: likedSet.has(r.id),
    comments: cmtsMap.get(String(r.id)) || [],
    image_path: r.image_path,
    /* 图片双源：主源 = GitHub Pages（与页面同源）；回退 = Supabase 存储 */
    url: "photos/" + r.image_path,
    thumbUrl: r.thumb_path ? "photos/" + r.thumb_path : "photos/" + r.image_path,
    sbUrl: storageUrl(r.image_path),
    sbThumb: r.thumb_path ? storageUrl(r.thumb_path) : storageUrl(r.image_path),
    w: r.w, h: r.h,
  }));
}

/* 照片压缩：最长边 1600 / JPEG 0.82，小图原样保留（几百张存免费档够用） */
function compressImage(file, maxSide = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      if (sc >= 1 && file.size < 500 * 1024) { URL.revokeObjectURL(url); resolve(file); return; }
      const w = Math.max(4, Math.round(img.naturalWidth * sc));
      const h = Math.max(4, Math.round(img.naturalHeight * sc));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";                 // 透明底补白（PNG→JPEG）
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob((blob) => { URL.revokeObjectURL(url); resolve(blob || file); }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/* 共享新增：压缩两版 → GitHub Contents API 传图片 → 写 memories.json */
async function addMemoryRemote(file) {
  const [blob, thumbBlob] = await Promise.all([
    compressImage(file, 1600, 0.82),
    compressImage(file, 480, 0.72),
  ]);
  const dim = await imageSize(blob);
  const ext = (blob.type && blob.type.split("/")[1]) || "jpg";
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  await ghPutFile("photos/" + path, ghB64Bytes(new Uint8Array(await blob.arrayBuffer())), "photo " + path);
  await ghPutFile("photos/thumb_" + path, ghB64Bytes(new Uint8Array(await thumbBlob.arrayBuffer())), "thumb " + path);
  const row = {
    id: path,
    createdAt: Date.now(),
    story: "",
    author: currentUserName(),
    season: seasonIdx,
    likes: 0,
    image_path: path,
    thumb_path: "thumb_" + path,
    w: dim.w, h: dim.h,
  };
  const mem = await ghReadJSON("data/memories.json", []);
  await ghWriteText("data/memories.json", [row, ...(Array.isArray(mem) ? mem : [])], "add memory " + path);
  return row;
}

/* 共享点赞：写 data/likes.json（幂等，重复操作直接成功）；网络抖动自动重试 3 次 */
async function toggleLikeRemote(m, nextLiked) {
  const doOp = async () => {
    const likes = await ghReadJSON("data/likes.json", []);
    const lk = Array.isArray(likes) ? likes : [];
    const visitor = currentVisitor();
    const has = lk.some((l) => l.memory_id === m.id && l.visitor === visitor);
    if (nextLiked && has) return;              // 已点过 → 幂等成功
    if (!nextLiked && !has) return;            // 未点过要取消 → 幂等成功
    const next = nextLiked ? [...lk, { memory_id: m.id, visitor }] : lk.filter((l) => !(l.memory_id === m.id && l.visitor === visitor));
    await ghWriteText("data/likes.json", next, "like " + m.id);
  };
  let lastErr = null;
  for (let i = 0; i < 3; i++) {
    try { await doOp(); return; }
    catch (err) {
      lastErr = err;
      if (i < 2) await new Promise((r) => setTimeout(r, 1200 * (i + 1)));
    }
  }
  throw lastErr;
}

/* 共享删除：从 memories.json 移除记录，并顺带清理 likes/comments 里的关联数据（照片文件保留在仓库里，不影响页面） */
async function deleteMemoryRemote(id) {
  const mem = await ghReadJSON("data/memories.json", []);
  const list = Array.isArray(mem) ? mem : [];
  if (!list.some((x) => x.id === id)) return;
  await ghWriteText("data/memories.json", list.filter((x) => x.id !== id), "delete memory " + id);
  try {
    const likes = await ghReadJSON("data/likes.json", []);
    const lk = Array.isArray(likes) ? likes.filter((l) => l.memory_id !== id) : [];
    if (!Array.isArray(likes) || lk.length !== likes.length) await ghWriteText("data/likes.json", lk, "clean likes " + id);
  } catch (e) { console.warn("清理点赞残留失败（不影响删除）", e); }
  try {
    const comments = await ghReadJSON("data/comments.json", []);
    const cm = Array.isArray(comments) ? comments.filter((c) => c.memory_id !== id) : [];
    if (!Array.isArray(comments) || cm.length !== comments.length) await ghWriteText("data/comments.json", cm, "clean comments " + id);
  } catch (e) { console.warn("清理评论残留失败（不影响删除）", e); }
}

/* 共享评论：追加到 data/comments.json（署名当前登录人） */
async function addCommentRemote(memoryId, text) {
  const comments = await ghReadJSON("data/comments.json", []);
  const cm = Array.isArray(comments) ? comments : [];
  const row = {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2),
    memory_id: memoryId,
    author: currentUserName(),
    text,
    createdAt: Date.now(),
  };
  await ghWriteText("data/comments.json", [...cm, row], "comment on " + memoryId);
  return row;
}

/* 共享评论：删除（仅本人的评论可删） */
async function deleteCommentRemote(commentId) {
  const comments = await ghReadJSON("data/comments.json", []);
  const cm = Array.isArray(comments) ? comments : [];
  const me = currentUserName();
  await ghWriteText("data/comments.json", cm.filter((c) => !(String(c.id) === String(commentId) && c.author === me)), "delete comment " + commentId);
}

/* 故事行数 = 评论数（一行一句回忆，对应粒子查看器逐行浮现） */
const storyLines = (story) => (story || "").split(/\n+/).map((s) => s.trim()).filter(Boolean).length;

/* ---------- 二、回忆墙 ---------- */
let memories = [];   // { id, story, createdAt, blob, url, w, h }

/* ---------- 季节板块（按回忆日期自动归季：3-5春 / 6-8夏 / 9-11秋 / 12-2冬） ---------- */
const SEASONS = [
  { label: "春", title: "春日回忆", sub: "万物萌发时收集起来的光", months: [2, 3, 4], empty: "这个春天还没有收藏回忆" },
  { label: "夏", title: "夏日回忆", sub: "蝉鸣、晚风和冰汽水的日子", months: [5, 6, 7], empty: "这个夏天还没有收藏回忆" },
  { label: "秋", title: "秋日回忆", sub: "落叶、暖阳和散步的傍晚", months: [8, 9, 10], empty: "这个秋天还没有收藏回忆" },
  { label: "冬", title: "冬日回忆", sub: "围炉、初雪和热可可的温度", months: [11, 0, 1], empty: "这个冬天还没有收藏回忆" },
];
const seasonOf = (ts) => {
  const m = new Date(ts).getMonth();
  return Math.max(0, SEASONS.findIndex((s) => s.months.includes(m)));
};
let seasonIdx = seasonOf(Date.now());   // 默认定位当前季节

function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

async function loadMemories() {
  if (remoteMode()) return loadMemoriesRemote();
  const recs = await memDB.all();
  for (const m of memories) { if (m.url && m.url.startsWith("blob:")) URL.revokeObjectURL(m.url); }
  recs.sort((a, b) => b.createdAt - a.createdAt);
  for (const r of recs) r.url = URL.createObjectURL(r.blob);
  memories = recs;
}

function storyPreview(story) {
  const line = (story || "").split(/\n+/).map((s) => s.trim()).filter(Boolean)[0] || "";
  return line.length > 26 ? line.slice(0, 26) + "…" : line;
}

function renderGrid() {
  const grid = $("memGrid");
  grid.innerHTML = "";
  const S = SEASONS[seasonIdx];
  $("memTitle").textContent = S.title;
  $("memSub").textContent = S.sub;
  const list = memories.filter((m) => (m.season ?? seasonOf(m.createdAt)) === seasonIdx);
  const emptyEl = $("memEmpty");
  emptyEl.hidden = list.length > 0;
  if (!list.length) {
    emptyEl.innerHTML = `<span class="big">✦</span>
      ${S.empty}<br>
      点击「＋ 添加回忆」，上传一张照片<br>
      再为它写下一小段你们的故事`;
  }
  specularGlow.clear();
  list.forEach((m, idx) => {
    const card = document.createElement("figure");
    card.className = "mem-card";
    card.style.setProperty("--i", Math.min(idx, 14));
    const preview = storyPreview(m.story);
    card.setAttribute("aria-label", `${preview || "还没写下故事"} · ${fmtDate(m.createdAt)}`);
    card.innerHTML = `
      <div class="mem-thumb"><img src="${m.thumbUrl}" alt="回忆照片" loading="lazy" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${m.sbThumb}';}else{this.onerror=null;this.src='${m.sbUrl}';}"></div>
      <figcaption>
        <div class="mem-actions"></div>
      </figcaption>
      <button class="mem-del" title="删除这段回忆">✕</button>`;
    const actions = card.querySelector(".mem-actions");

    /* 点赞：PulseHeart 脉冲心形（弹簧脉冲 + 数字滚动）；云端模式同步到共享库 */
    const heartBtn = createPulseHeart({
      liked: !!m.liked,
      count: m.likes || 0,
      onToggle: async (liked, likes) => {
        const prev = { liked: m.liked, likes: m.likes };
        m.liked = liked; m.likes = likes;
        if (remoteMode()) {
          try { await toggleLikeRemote(m, liked); }
          catch (_) {
            m.liked = prev.liked; m.likes = prev.likes;   // 失败回滚
            toast("点赞同步失败，请检查网络");
            renderGrid();
          }
        } else {
          try { await memDB.put(m); } catch (_) { /* 存储失败静默 */ }
        }
      },
    });
    actions.appendChild(heartBtn);

    /* 评论：SpecularButton 流光边框（点开大家的评论，每条带署名） */
    const cmtBtn = document.createElement("button");
    cmtBtn.type = "button";
    cmtBtn.className = "specular-button";
    cmtBtn.title = "大家的评论";
    cmtBtn.setAttribute("aria-label", "评论，看看大家说了什么");
    cmtBtn.innerHTML = `
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${CHAT_ICON}"></path></svg>
      <span>${(m.comments || []).length}</span>`;
    cmtBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      showCommentsModal(m.id);
    });
    actions.appendChild(cmtBtn);
    specularGlow.register(cmtBtn);

    card.addEventListener("click", (e) => {
      if (e.target.closest(".mem-del, .pulse-heart, .specular-button")) return;
      photoViewer.open(m, card.querySelector(".mem-thumb img"));
    });
    card.querySelector(".mem-del").addEventListener("click", (e) => {
      e.stopPropagation();
      openDelConfirm(m.id);
    });
    grid.appendChild(card);
  });
}

/* ---------- 〇g、PulseHeart 点赞按钮（卡片动作行，原生移植 React Bits PulseHeart） ----------
 * 参数对应（组件默认）：count 0 · showCount · icon heart · idleOutline true
 * size 40→32（卡片适配）· corner 32→16 · likedColor #ff4d6d · idleColor #8b8b93
 * pillColor #232326 · textColor #f5f5f5 · duration 560 · dotSize 0.3
 * overshoot 1.7 · beat 3 · rollDuration 350
 * 逻辑逐行照搬：swell 脉冲曲线（easeOutCubic 升 + easeOutBack 回落过冲）
 * t≥40% 切换 liked 态并滚动数字（单位数翻牌 / 整组翻滚）· 尊重 prefers-reduced-motion */
const HEART_OUTLINE = "M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.27l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z";
const HEART_FILLED = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
const CHAT_ICON = "M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z";
const fmtNum = (n) => new Intl.NumberFormat().format(n);

function createPulseHeart({ liked = false, count = 0, onToggle, size = 32, corner = 16 } = {}) {
  const OUT = 0.4;
  const DURATION = 560, DOT = 0.3, OVERSHOOT = 1.7, BEAT = 3, ROLL_MS = 350;
  const back = (k, c) => { const u = k - 1; return 1 + (c + 1) * u ** 3 + c * u ** 2; };
  const swellOf = (t, c) => (t <= 0 ? 0 : t < OUT ? 1 - (1 - t / OUT) ** 3 : 1 - back((t - OUT) / (1 - OUT), c));
  const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  const el = document.createElement("button");
  el.type = "button";
  el.className = "pulse-heart";
  el.dataset.liked = String(liked);
  el.setAttribute("aria-pressed", String(liked));
  el.setAttribute("aria-label", liked ? `取消点赞，${fmtNum(count)}` : `点赞，${fmtNum(count)}`);
  el.style.setProperty("--ph-size", size + "px");
  el.style.setProperty("--ph-corner", corner + "px");
  el.style.setProperty("--ph-roll", ROLL_MS + "ms");
  el.style.setProperty("--ph-stroke", (1.5 * size) / 24 + "px");
  el.innerHTML = `
    <span class="ph-pill">
      <span class="ph-heart" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <g class="ph-glyph">
            <path class="ph-line" d="${HEART_OUTLINE}" vector-effect="non-scaling-stroke"></path>
            <path class="ph-solid" d="${HEART_FILLED}"></path>
          </g>
        </svg>
      </span>
      <span class="ph-count" aria-hidden="true"></span>
    </span>`;

  const pill = el.querySelector(".ph-pill");
  const glyph = el.querySelector(".ph-glyph");
  const countEl = el.querySelector(".ph-count");
  let raf = 0, rollTimer = 0;
  let shown = { liked, count };
  const logical = { liked, count };

  function renderCount(text) {
    countEl.innerHTML = "";
    for (const ch of text) {
      const s = document.createElement("span");
      s.textContent = ch;
      countEl.appendChild(s);
    }
  }
  renderCount(fmtNum(count));

  function applyShown() {
    el.dataset.liked = String(shown.liked);
    el.setAttribute("aria-pressed", String(shown.liked));
    el.setAttribute("aria-label", shown.liked ? `取消点赞，${fmtNum(shown.count)}` : `点赞，${fmtNum(shown.count)}`);
  }

  /* 数字滚动（照搬 startRoll）：位数相同且只变一位 → 单字翻牌，否则整组翻滚 */
  function startRoll(from, to) {
    if (from === to) return;
    const a = fmtNum(from), b = fmtNum(to);
    const changed = a.length === b.length ? [...b].flatMap((ch, i) => (ch !== a[i] ? [i] : [])) : [];
    const roll = { a, b, at: changed.length === 1 ? changed[0] : -1, up: to > from };
    countEl.innerHTML = "";
    const cells = roll.at === -1
      ? [{ top: roll.up ? roll.a : roll.b, bottom: roll.up ? roll.b : roll.a }]
      : [...roll.b].map((ch, i) => i === roll.at
        ? { top: roll.up ? roll.a[i] : ch, bottom: roll.up ? ch : roll.a[i] }
        : { ch });
    for (const cell of cells) {
      if ("ch" in cell) {
        const s = document.createElement("span");
        s.textContent = cell.ch;
        countEl.appendChild(s);
      } else {
        const slot = document.createElement("span");
        slot.className = "ph-slot";
        const rollEl = document.createElement("span");
        rollEl.className = "ph-roll";
        const top = document.createElement("span"); top.textContent = cell.top;
        const bottom = document.createElement("span"); bottom.textContent = cell.bottom;
        rollEl.append(top, bottom);
        slot.appendChild(rollEl);
        countEl.appendChild(slot);
        rollEl.style.transition = "none";
        rollEl.style.transform = `translateY(${roll.up ? "0" : "-1em"})`;
        void rollEl.offsetHeight;
        rollEl.style.transition = "";
        rollEl.style.transform = `translateY(${roll.up ? "-1em" : "0"})`;
      }
    }
    clearTimeout(rollTimer);
    rollTimer = setTimeout(() => renderCount(fmtNum(shown.count)), ROLL_MS);
  }

  /* 脉冲动画（照搬 run）：t≥40% 时换 liked 态 + 滚数字，末帧同步逻辑值 */
  function run(nextLiked, nextCount) {
    el.dataset.running = "";
    let swapped = false, prev = 0;
    const t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / DURATION);
      const step = prev ? now - prev : 1000 / 60;
      prev = now;
      const s = swellOf(t, OVERSHOOT);
      const k = 1 - (1 - DOT) * s;
      glyph.setAttribute("transform", `translate(12 12) scale(${k}) translate(-12 -12)`);
      pill.style.transform = `scale(${1 - (BEAT / 100) * s})`;
      if (!swapped && t + step / 2 / DURATION >= OUT) {
        swapped = true;
        const from = shown.count;
        shown = { liked: nextLiked, count: nextCount };
        applyShown();
        startRoll(from, nextCount);
      }
      if (t < 1) { raf = requestAnimationFrame(tick); return; }
      raf = 0;
      glyph.removeAttribute("transform");
      pill.style.transform = "";
      delete el.dataset.running;
      if (logical.liked !== shown.liked || logical.count !== shown.count) {
        shown = { liked: logical.liked, count: logical.count };
        applyShown();
        renderCount(fmtNum(shown.count));
      }
    };
    raf = requestAnimationFrame(tick);
  }

  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (!reducedMotion()) el.dataset.pressed = "";
  });
  const unpress = () => { delete el.dataset.pressed; };
  el.addEventListener("pointerup", unpress);
  el.addEventListener("pointerleave", unpress);
  el.addEventListener("pointercancel", unpress);

  el.addEventListener("click", (e) => {
    if (raf) return;
    const viaPointer = e.detail !== 0;
    const nextLiked = !logical.liked;
    const nextCount = logical.count + (nextLiked ? 1 : -1);
    logical.liked = nextLiked; logical.count = nextCount;
    onToggle?.(nextLiked, nextCount);
    if (viaPointer && !reducedMotion()) run(nextLiked, nextCount);
    else {
      shown = { liked: nextLiked, count: nextCount };
      applyShown();
      renderCount(fmtNum(nextCount));
    }
  });

  return el;
}

/* ---------- 〇h、SpecularButton 流光边框（评论按钮，WebGL2 共享画布移植 React Bits SpecularButton） ----------
 * 参数对应（组件默认）：radius 18→16 · lineColor #ffffff · baseColor #525252
 * intensity 1 · idleIntensity 0.35 · shineSize 10 · shineFade 34 · thickness 1.2
 * glow 1 · speed 0.35 · followMouse true · proximity 250
 * 着色器逐行照搬（roundedBox SDF + 环形流光 lobe + 内辉光 + 发丝底边）
 * 改造点：多按钮共享一张全屏 WebGL2 画布（scissor 限域 + premultiplied 加法混合），
 * 流光斑随指针接近增强并沿圆角边环游走（loopPosition / rimPoint 照搬） */
const specularGlow = (() => {
  const PAD = 24;

  const VERTEX = `#version 300 es
in vec2 aPosition;
void main() {
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

  const FRAGMENT = `#version 300 es
precision highp float;
uniform vec2 uCenter;
uniform vec2 uHalf;
uniform float uRadius;
uniform float uPx;
uniform float uSpot;
uniform vec2 uEntry;
uniform vec3 uLineColor;
uniform vec3 uBaseColor;
uniform float uIntensity;
uniform vec2 uWindow;
uniform float uThickness;
uniform float uGlow;
out vec4 outColor;

float roundedBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float loopPosition(vec2 p, vec2 b, float r) {
  vec2 inner = b - r;
  float arc = 1.5707963 * r;
  float quarter = inner.x + inner.y + arc;
  vec2 a = abs(p);
  vec2 q = a - inner;
  float s = q.x > 0.0 && q.y > 0.0
    ? inner.y + atan(q.y, q.x) * r
    : (q.x > q.y ? min(a.y, inner.y) : inner.y + arc + inner.x - min(a.x, inner.x));
  if (p.x < 0.0) s = p.y >= 0.0 ? 2.0 * quarter - s : 2.0 * quarter + s;
  else if (p.y < 0.0) s = 4.0 * quarter - s;
  return s / max(4.0 * quarter, 0.0001);
}

float lobe(float position, float center) {
  float gap = abs(fract(position - center + 0.5) - 0.5);
  return 1.0 - smoothstep(uWindow.x, uWindow.x + uWindow.y, gap);
}

void main() {
  vec2 p = gl_FragCoord.xy - uCenter;
  float d = roundedBox(p, uHalf, uRadius);
  float position = loopPosition(p, uHalf, uRadius);
  float key = lobe(position, uSpot);
  float back = lobe(position, uSpot + 0.5);
  float streak = key + back * 0.45;
  float width = max(uThickness * uPx * mix(1.0, max(key, back), 0.6), 0.35);
  float band = smoothstep(-width - 0.6, -width + 0.6, d) * (1.0 - smoothstep(-0.6, 0.6, d));
  float hair = smoothstep(-uPx - 0.6, -uPx + 0.6, d) * (1.0 - smoothstep(-0.6, 0.6, d));
  float inside = 1.0 - smoothstep(-0.6, 0.6, d);
  vec2 pool = (p - uEntry) / (uHalf.y * vec2(1.6, 1.1));
  float glow = streak * 0.2 * exp(-abs(d + width * 0.5) / (5.0 * uPx)) + inside * 0.08 * exp(-dot(pool, pool));
  float light = clamp((band * streak + glow * uGlow) * uIntensity, 0.0, 1.0);
  vec4 base = vec4(uBaseColor, 1.0) * hair * 0.6;
  outColor = vec4(uLineColor, 1.0) * light + base * (1.0 - light);
}`;

  const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const wrap = (v) => v - Math.floor(v);

  function loopPos(x, y, halfX, halfY, r) {
    const innerX = halfX - r, innerY = halfY - r;
    const arc = (Math.PI / 2) * r;
    const quarter = innerX + innerY + arc;
    const ax = Math.abs(x), ay = Math.abs(y);
    const qx = ax - innerX, qy = ay - innerY;
    let s;
    if (qx > 0 && qy > 0) s = innerY + Math.atan2(qy, qx) * r;
    else if (qx > qy) s = Math.min(ay, innerY);
    else s = innerY + arc + innerX - Math.min(ax, innerX);
    if (x < 0) s = y >= 0 ? 2 * quarter - s : 2 * quarter + s;
    else if (y < 0) s = 4 * quarter - s;
    return wrap(s / Math.max(4 * quarter, 0.0001));
  }

  function rimPoint(position, halfX, halfY, r) {
    const innerX = halfX - r, innerY = halfY - r;
    const arc = (Math.PI / 2) * r;
    const quarter = innerX + innerY + arc;
    let s = wrap(position) * 4 * quarter;
    let signX = 1, signY = 1;
    if (s > 3 * quarter) { s = 4 * quarter - s; signY = -1; }
    else if (s > 2 * quarter) { s -= 2 * quarter; signX = -1; signY = -1; }
    else if (s > quarter) { s = 2 * quarter - s; signX = -1; }
    let x = innerX - (s - innerY - arc);
    let y = halfY;
    if (s <= innerY) { x = halfX; y = s; }
    else if (s <= innerY + arc) {
      const angle = (s - innerY) / Math.max(r, 0.0001);
      x = innerX + Math.cos(angle) * r;
      y = innerY + Math.sin(angle) * r;
    }
    return [x * signX, y * signY];
  }

  let canvas = null, gl = null, prog = null, vao = null;
  const loc = {};
  const entries = new Map();
  const pointer = { x: 0, y: 0, known: false };
  let raf = 0, last = 0, dpr = 1, attached = false;
  const probe = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
  const colors = new Map();

  function toRgb(value) {
    if (colors.has(value)) return colors.get(value);
    let rgb = [1, 1, 1];
    if (probe) {
      probe.clearRect(0, 0, 1, 1);
      probe.fillStyle = "#000000";
      probe.fillStyle = value;
      probe.fillRect(0, 0, 1, 1);
      const d = probe.getImageData(0, 0, 1, 1).data;
      rgb = [d[0] / 255, d[1] / 255, d[2] / 255];
    }
    colors.set(value, rgb);
    return rgb;
  }

  function compile(type, source) {
    const sh = gl.createShader(type);
    if (!sh) return null;
    gl.shaderSource(sh, source);
    gl.compileShader(sh);
    if (gl.getShaderParameter(sh, gl.COMPILE_STATUS)) return sh;
    gl.deleteShader(sh);
    return null;
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
    canvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
  }

  function ensure() {
    if (canvas) return true;
    canvas = document.createElement("canvas");
    canvas.className = "specular-layer";
    canvas.setAttribute("aria-hidden", "true");
    document.body.appendChild(canvas);
    gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
    if (!gl) { canvas.remove(); canvas = null; return false; }
    const vs = compile(gl.VERTEX_SHADER, VERTEX);
    const fs = compile(gl.FRAGMENT_SHADER, FRAGMENT);
    prog = gl.createProgram();
    if (!vs || !fs || !prog) { canvas.remove(); canvas = null; gl = null; return false; }
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.bindAttribLocation(prog, 0, "aPosition");
    gl.linkProgram(prog);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.remove(); canvas = null; gl = null; return false; }
    for (const n of ["uCenter", "uHalf", "uRadius", "uPx", "uSpot", "uEntry", "uLineColor", "uBaseColor", "uIntensity", "uWindow", "uThickness", "uGlow"]) loc[n] = gl.getUniformLocation(prog, n);
    const buffer = gl.createBuffer();
    vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    layout();
    attach();
    return true;
  }

  function onMove(e) { pointer.x = e.clientX; pointer.y = e.clientY; pointer.known = true; wake(); }
  function onEnd(e) { if (e.pointerType === "mouse") return; pointer.known = false; wake(); }
  function onResize() { if (!canvas) return; layout(); wake(); }
  function attach() {
    if (attached) return;
    attached = true;
    window.addEventListener("pointermove", onMove, { passive: true });
    window.addEventListener("pointerup", onEnd, { passive: true });
    window.addEventListener("pointercancel", onEnd, { passive: true });
    window.addEventListener("resize", onResize);
  }

  function restSpot(en) {
    const r = Math.min(en.radius, en.rect.width / 2, en.rect.height / 2);
    const inset = r * (1 - Math.SQRT1_2);
    return loopPos(inset - en.rect.width / 2, en.rect.height / 2 - inset, en.rect.width / 2, en.rect.height / 2, r);
  }

  function aim(en) {
    if (!en.followMouse || !pointer.known) return null;
    const rect = en.rect;
    const halfX = rect.width / 2, halfY = rect.height / 2;
    const x = pointer.x - (rect.left + rect.width / 2);
    const y = (rect.top + rect.height / 2) - pointer.y;
    const r = Math.min(en.radius, halfX, halfY);
    const distance = Math.hypot(Math.max(Math.abs(x) - halfX, 0), Math.max(Math.abs(y) - halfY, 0));
    const t = clampN(1 - distance / en.proximity, 0, 1);
    const near = t * t * (3 - 2 * t);
    const nearest = loopPos(x, y, halfX, halfY, r);
    if (distance > 0) return { spot: nearest, near };
    const depth = clampN(Math.min(halfX - Math.abs(x), halfY - Math.abs(y)) / (halfY * 0.8), 0, 1);
    const sway = restSpot(en) - (x / halfX) * 0.06 - (y / halfY) * 0.02;
    const offset = sway - nearest - Math.round(sway - nearest);
    return { spot: wrap(nearest + offset * depth * depth * (3 - 2 * depth)), near };
  }

  function drawEntry(en) {
    const rect = en.rect;
    const cx = (rect.left + rect.width / 2) * dpr;
    const cy = canvas.height - (rect.top + rect.height / 2) * dpr;
    const rCss = Math.min(en.radius, rect.width / 2, rect.height / 2);
    gl.uniform2f(loc.uCenter, cx, cy);
    gl.uniform2f(loc.uHalf, (rect.width / 2) * dpr, (rect.height / 2) * dpr);
    gl.uniform1f(loc.uRadius, rCss * dpr);
    gl.uniform1f(loc.uPx, dpr);
    gl.uniform1f(loc.uSpot, en.spot);
    const [rimX, rimY] = rimPoint(en.spot, rect.width / 2, rect.height / 2, rCss);
    const rimLen = Math.hypot(rimX, rimY);
    const pull = 1 - Math.min(0.35 * (rect.height / 2), rimLen) / Math.max(rimLen, 0.0001);
    gl.uniform2f(loc.uEntry, cx + rimX * pull * dpr, cy + rimY * pull * dpr);
    gl.uniform3fv(loc.uLineColor, en.lineColor);
    gl.uniform3fv(loc.uBaseColor, en.baseColor);
    gl.uniform1f(loc.uIntensity, en.intensity * (en.level + en.press * 0.8));
    gl.uniform2f(loc.uWindow, en.shineSize / 360 + en.press * 0.06, en.shineFade / 360 + 0.0001);
    gl.uniform1f(loc.uThickness, en.thickness);
    gl.uniform1f(loc.uGlow, en.glow);
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor((rect.left - PAD) * dpr, canvas.height - (rect.top + rect.height + PAD) * dpr,
      (rect.width + PAD * 2) * dpr, (rect.height + PAD * 2) * dpr);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
    gl.disable(gl.SCISSOR_TEST);
  }

  function frame(now) {
    frameBody(now);
  }

  /* 全屏遮罩打开时（登录层/查看器/弹窗），流光不绘制、画布保持透明，杜绝残影透出 */
  function modalOpenMasked() {
    const ids = ["photoViewer", "memoLayer", "storyModal", "commentsModal"];
    for (const id of ids) {
      const el = document.getElementById(id);
      if (el && !el.hidden) return true;
    }
    const ll = document.getElementById("loginLayer");
    if (ll && !ll.classList.contains("hidden") && !ll.classList.contains("leaving")) return true;
    return false;
  }

  function frameBody(now) {
    gl.viewport(0, 0, canvas.width, canvas.height);   /* viewport 不会随 canvas 尺寸自动更新，每帧显式设置 */
    raf = 0;
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
    last = now;
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (modalOpenMasked()) { last = 0; return; }      /* 遮罩打开：不绘制流光，也不调度下一帧 */
    gl.useProgram(prog);
    let active = false;
    const VH = window.innerHeight, VW = window.innerWidth;
    for (const en of entries.values()) {
      if (!en.el.isConnected) { entries.delete(en.el); continue; }
      const rect = en.el.getBoundingClientRect();   /* 每帧重测（卡片 hover 位移 / 滚动） */
      en.rect = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
      if (rect.bottom < -PAD || rect.top > VH + PAD || rect.right < -PAD || rect.left > VW + PAD) continue;
      if (!en.ready) { en.spot = restSpot(en); en.level = en.idleIntensity; en.ready = true; }
      const target = aim(en);
      let diff = (target ? target.spot : restSpot(en)) - en.spot;
      diff -= Math.round(diff);
      en.spot = wrap(en.spot + diff * (1 - Math.exp(-dt * 8)));
      const level = en.idleIntensity + (1 - en.idleIntensity) * (target ? target.near : 0);
      en.level += (level - en.level) * (1 - Math.exp(-dt * 7));
      en.press *= Math.exp(-dt * 5);
      drawEntry(en);
      if (Math.abs(diff) > 0.0002 || Math.abs(level - en.level) > 0.001 || en.press > 0.002) active = true;
    }
    if (active) raf = requestAnimationFrame(frame);
    else { last = 0; gl.clear(gl.COLOR_BUFFER_BIT); }  /* 动画停止：清空画布，杜绝残影停留在全屏层 */
  }

  function wake() { if (!raf && gl && entries.size) raf = requestAnimationFrame(frame); }

  function onPress(e) {
    const en = entries.get(e.currentTarget);
    if (!en) return;
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.known = true;
    en.press = 1;
    wake();
  }

  return {
    register(el, opts = {}) {
      if (!ensure()) return;
      entries.set(el, {
        el,
        rect: { left: 0, top: 0, width: 1, height: 1 },
        radius: Math.max(0, opts.radius ?? 16),
        lineColor: toRgb(opts.lineColor || "#ffffff"),
        baseColor: toRgb(opts.baseColor || "#525252"),
        intensity: Math.max(0, opts.intensity ?? 1),
        idleIntensity: clampN(opts.idleIntensity ?? 0.35, 0, 1),
        shineSize: Math.max(0, opts.shineSize ?? 10),
        shineFade: Math.max(0, opts.shineFade ?? 34),
        thickness: Math.max(0, opts.thickness ?? 1.2),
        glow: Math.max(0, opts.glow ?? 1),
        proximity: Math.max(1, opts.proximity ?? 250),
        followMouse: opts.followMouse !== false,
        spot: 0, level: 0, press: 0, ready: false,
      });
      el.addEventListener("pointerdown", onPress);
      wake();
    },
    clear() {
      for (const [el] of entries) el.removeEventListener("pointerdown", onPress);
      entries.clear();
    },
    wake,
  };
})();

/* ---------- RubberSegment 橡皮切换器（拖拽跟手 + squash 果冻回弹） ---------- */
const seasonSeg = (() => {
  const seg = $("seasonSeg"), thumb = $("rsThumb");
  const items = Array.from(seg.querySelectorAll(".rs-item"));
  if (!seg || !thumb || !items.length) return { };
  let idx = seasonIdx;
  let dragging = false, moved = false, startIdx = -1;

  const slotW = () => (seg.clientWidth - 6) / 4;

  function place(i, instant) {
    if (instant) thumb.classList.add("dragging");
    thumb.style.setProperty("--x", (i * slotW()) + "px");
    if (instant) { void thumb.offsetWidth; thumb.classList.remove("dragging"); }
  }
  function squash() {
    thumb.style.setProperty("--sx", "1.22");
    thumb.style.setProperty("--sy", "0.86");
    setTimeout(() => {
      thumb.style.setProperty("--sx", "1");
      thumb.style.setProperty("--sy", "1");
    }, 120);
  }
  function setActive(i) {
    idx = i;
    items.forEach((b, k) => b.classList.toggle("active", k === i));
  }
  function setSeason(i) {
    setActive(i);
    place(i);
    squash();
    seasonIdx = i;
    renderGrid();
    applySeasonBg(i);
  }

  seg.addEventListener("pointerdown", (e) => {
    dragging = true;
    moved = false;
    startIdx = items.indexOf(e.target.closest(".rs-item"));
    try { seg.setPointerCapture(e.pointerId); } catch (_) {}
    thumb.classList.add("dragging");
  });
  seg.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    moved = true;
    const rect = seg.getBoundingClientRect();
    const w = slotW();
    let x = e.clientX - rect.left - 3 - w / 2;   // 滑块中心跟随指针
    x = Math.max(0, Math.min(3 * w, x));
    thumb.style.setProperty("--x", x + "px");
    const near = Math.round(x / w);
    if (near !== idx) setActive(near);            // 文字颜色实时预览
  });
  function finish(e) {
    if (!dragging) return;
    dragging = false;
    thumb.classList.remove("dragging");
    let i;
    if (moved && e.clientX != null && e.clientX > 0) {
      const rect = seg.getBoundingClientRect();
      i = Math.max(0, Math.min(3, Math.floor((e.clientX - rect.left - 3) / slotW())));
    } else {
      i = startIdx >= 0 ? startIdx : idx;   // 点击：选被按下的按钮，与坐标无关
    }
    setSeason(i);
  }
  seg.addEventListener("pointerup", finish);
  seg.addEventListener("pointercancel", finish);
  window.addEventListener("resize", () => place(idx, true));
  items.forEach((b, i) => b.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSeason(i); }
  }));

  setActive(idx);
  requestAnimationFrame(() => place(idx, true));
  return {};
})();

/* 上传照片：相册多选 + 拍照直传（手机） */
async function handleFiles(e) {
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length) return;
  let n = 0, failed = 0;
  for (const file of files) {
    if (!file.type.startsWith("image/")) continue;
    try {
      if (remoteMode()) {
        await addMemoryRemote(file);          // 云端：压缩后传共享库
      } else {
        const dim = await imageSize(file);
        await memDB.put({
          id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)),
          story: "", createdAt: ts(), blob: file, w: dim.w, h: dim.h,
          author: currentUserName(),          // 上传者署名
          comments: [],
          season: seasonIdx,   // 存入当前停留的板块（在哪个页面添加，就存进哪个季节）
        });
      }
      n++;
    } catch (err) { failed++; console.warn("上传失败", err); }
  }
  if (n) {
    try { await loadMemories(); } catch (_) {}
    renderGrid();
    toast(failed ? `已收藏 ${n} 张回忆 ✦（${failed} 张失败，可重试）` : `已收藏 ${n} 张回忆 ✦`);
  } else if (failed) {
    toast("上传失败，请检查网络后重试");
  }
}
$("btnAdd").addEventListener("click", () => $("fileInput").click());
$("btnCam").addEventListener("click", () => $("cameraInput").click());
$("fileInput").addEventListener("change", handleFiles);
$("cameraInput").addEventListener("change", handleFiles);

function ts() { return Date.now(); }

function imageSize(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve({ w: img.naturalWidth, h: img.naturalHeight }); URL.revokeObjectURL(url); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode failed")); };
    img.src = url;
  });
}

/* ---------- 三、照片查看器（点击放大 FLIP + 再点 3D 翻转看故事） ---------- */
const photoViewer = (() => {
  const V = $("photoViewer"), stage = $("pvStage"), flip = $("pvFlip"), img = $("pvImg");
  const shadowEl = $("pvShadow");
  const frontFace = flip.querySelector(".pv-front");
  const backFace = flip.querySelector(".pv-back");
  const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
  let openId = null, current = null;

  /* ===== 3D 弹簧翻转卡片引擎（点击 / 按住拖动 / 轻弹，全部弹簧驱动） ===== */
  const TURN_SPRING = { k: 170, c: 20, m: 1 };      // 翻面主弹簧
  const TILT_SPRING = { k: 240, c: 24, m: 0.6 };   // 悬停倾斜跟随
  const LIFT_SPRING = { k: 320, c: 26, m: 1 };      // 悬浮缩放 / 光斑
  const SLOP = { fine: 4, coarse: 8 };              // 判定"拖动"的最小位移
  const HISTORY_MS = 90, FLING = 0.16;              // 轻弹：取最近 90ms 速度外推
  const TILT_MAX = 12, HOVER_SCALE = 1.03;

  const mkSpring = (x0, cfg) => ({ x: x0, v: 0, t: x0, ...cfg,
    jump(v) { this.x = this.t = v; this.v = 0; } });
  const turn = mkSpring(0, TURN_SPRING);            // 翻转角（可累计多圈）
  const tiltX = mkSpring(0, TILT_SPRING), tiltY = mkSpring(0, TILT_SPRING);
  const lift = mkSpring(1, LIFT_SPRING), sheen = mkSpring(0, LIFT_SPRING);
  let gx = 50, gy = 50;                             // 光斑位置

  const snap = d => Math.round(d / 180) * 180;
  const isBack = d => Math.abs(Math.round(d / 180)) % 2 === 1;
  const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  let shown = false, target = 0, raf = 0, lastT = 0, running = false;
  let grip = null, suppressClick = false;

  function stepSpring(s, dt) {                      // F = -kx - cv（半隐式欧拉）
    s.v += ((-s.k * (s.x - s.t) - s.c * s.v) / s.m) * dt;
    s.x += s.v * dt;
    return Math.abs(s.x - s.t) > 0.05 || Math.abs(s.v) > 0.4;
  }
  function render() {
    if (reduceMQ.matches) return;
    const ry = turn.x + tiltY.x;
    flip.style.transform =
      `scale(${lift.x.toFixed(4)}) rotateX(${tiltX.x.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
    flip.style.setProperty("--fc-gx", gx.toFixed(1) + "%");
    flip.style.setProperty("--fc-gy", gy.toFixed(1) + "%");
    flip.style.setProperty("--fc-sheen", sheen.x.toFixed(3));
    const f = Math.abs(Math.cos((turn.x * Math.PI) / 180));  // 正对屏幕程度 0~1
    shadowEl.style.transform = `translateX(-50%) scaleX(${(0.08 + 0.92 * f).toFixed(3)})`;
    shadowEl.style.opacity = (0.1 + 0.9 * f * f).toFixed(3);
  }
  function frame(now) {
    const dt = clampN((now - lastT) / 1000, 1 / 240, 1 / 30);
    lastT = now;
    const dragging = grip && grip.moved;
    const s1 = stepSpring(tiltX, dt), s2 = stepSpring(tiltY, dt),
          s3 = stepSpring(lift, dt), s4 = stepSpring(sheen, dt);
    const live = (dragging ? false : stepSpring(turn, dt)) || s1 || s2 || s3 || s4;
    render();
    if (live || grip) raf = requestAnimationFrame(frame);
    else running = false;
  }
  function loop() {
    if (running) return;
    running = true;
    lastT = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function syncFace() {                            // 面向状态同步（提示语 + 无障碍）
    flip.setAttribute("aria-pressed", String(shown));
    flip.dataset.face = shown ? "back" : "front";
    frontFace.inert = shown;                        // 翻走的面不可交互
    backFace.inert = !shown;
    $("pvHint").textContent = shown
      ? "再点一下，翻回照片"
      : "点击 · 按住左右拖动 · 轻弹 —— 翻到背面看这段回忆";
  }
  function settle(to, velocity) {                  // 弹簧飞向目标角（带初速度）
    target = to;
    const next = isBack(to);
    if (next !== shown) { shown = next; syncFace(); }
    if (reduceMQ.matches) { turn.jump(to); flip.style.transform = ""; return; }
    turn.t = to;
    turn.v = velocity || 0;
    loop();
  }
  function flipCard() {                            // 点击 / 键盘：翻一面
    const base = snap(turn.x);
    settle(isBack(base) ? base - 180 : base + 180, 0);
  }
  function rest() {                                // 松手离场：各弹簧归位
    tiltX.t = 0; tiltY.t = 0; sheen.t = 0; lift.t = 1;
    loop();
  }
  function resetCard() {                           // 打开 / 关闭时归零
    turn.jump(0); target = 0; shown = false; grip = null;
    tiltX.jump(0); tiltY.jump(0); lift.jump(1); sheen.jump(0); gx = 50; gy = 50;
    flip.style.transform = "";
    shadowEl.style.transform = "translateX(-50%) scaleX(1)";
    shadowEl.style.opacity = "0.95";
    syncFace();
  }

  function fitSize(w, h) {
    const maxW = Math.min(innerWidth * 0.72, 900);
    const maxH = innerHeight * 0.68;
    const sc = Math.min(maxW / w, maxH / h);
    return { w: Math.round(w * sc), h: Math.round(h * sc) };
  }

  function buildBack(m) {
    $("pvDate").textContent = "— " + fmtDate(m.createdAt) + " —";
    const story = (m.story || "").trim();
    $("pvStory").innerHTML = story
      ? escapeHtml(story)
      : "<span class='pv-empty-story'>这段回忆还没有故事<br>点下方「编辑这段故事」为它写下第一句吧</span>";
  }

  function open(m, fromEl) {
    openId = m.id;
    current = m;
    resetCard();
    buildBack(m);
    img.onerror = () => { img.onerror = null; if (m.sbUrl) img.src = m.sbUrl; };   // GitHub 源失败自动回退 Supabase
    img.src = m.url;
    V.hidden = false;
    document.body.classList.add("lock-scroll");

    const size = fitSize(m.w || 4, m.h || 3);
    stage.style.width = size.w + "px";
    stage.style.height = size.h + "px";

    /* FLIP：从缩略图位置平滑放大到中央 */
    if (fromEl) {
      const fr = fromEl.getBoundingClientRect();
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const dx = fr.left + fr.width / 2 - cx;
      const dy = fr.top + fr.height / 2 - cy;
      const sc = Math.max(fr.width / size.w, 0.05);
      stage.style.transition = "none";
      stage.style.transform = `translate(${dx}px, ${dy}px) scale(${sc})`;
      stage.style.opacity = "0.4";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        stage.style.transition = "transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease";
        stage.style.transform = "none";
        stage.style.opacity = "1";
      }));
    }
    requestAnimationFrame(() => V.classList.add("show"));
  }

  function close() {
    if (!openId) return;
    openId = null;
    current = null;
    V.classList.remove("show");
    document.body.classList.remove("lock-scroll");
    setTimeout(() => {
      V.hidden = true;
      resetCard();
      img.src = "";
      specularGlow.wake();
    }, 400);
  }

  /* ===== 交互绑定：按下 → 拖动跟手 → 松手按速度决定翻到哪一面 ===== */
  flip.addEventListener("pointerdown", e => {
    suppressClick = false;
    if (e.button !== 0 || grip) return;
    if (e.target.closest("button, a, input, textarea")) return;  // 背面按钮不触发翻面
    try { flip.setPointerCapture(e.pointerId); } catch {}
    grip = {
      id: e.pointerId, x: e.clientX, y: e.clientY, base: turn.x, moved: false,
      slop: e.pointerType === "touch" ? SLOP.coarse : SLOP.fine, hist: []
    };
    if (!reduceMQ.matches) { lift.t = HOVER_SCALE; loop(); }
  });
  flip.addEventListener("pointermove", e => {
    const g = grip;
    if (g && g.id === e.pointerId) {                // 拖动：角度实时跟手
      const d = e.clientX - g.x;
      if (!g.moved) {
        if (Math.abs(d) < g.slop || reduceMQ.matches) return;
        g.moved = true;
        suppressClick = true;
        flip.dataset.dragging = "";
        tiltX.t = 0; tiltY.t = 0; sheen.t = 0;      // 拖面时收起倾斜和光斑
      }
      const span = stage.clientWidth || 320;
      const deg = g.base + (d / span) * 180;        // 拖满一卡宽 = 转 180°
      turn.x = deg;
      g.hist.push({ t: performance.now(), v: deg });
      while (g.hist.length > 2 && performance.now() - g.hist[0].t > HISTORY_MS) g.hist.shift();
      render();
      loop();
      return;
    }
    if (reduceMQ.matches || e.pointerType === "touch") return;
    const r = flip.getBoundingClientRect();          // 悬停：倾斜 + 光斑跟随指针
    const px = clampN((e.clientX - r.left) / r.width, 0, 1);
    const py = clampN((e.clientY - r.top) / r.height, 0, 1);
    tiltX.t = (0.5 - py) * 2 * TILT_MAX;
    tiltY.t = (px - 0.5) * 2 * TILT_MAX;
    gx = px * 100; gy = py * 100;
    sheen.t = 1;
    loop();
  });
  function release(e, cancelled) {
    const g = grip;
    if (!g || g.id !== e.pointerId) return;
    grip = null;
    delete flip.dataset.dragging;
    try { if (flip.hasPointerCapture(e.pointerId)) flip.releasePointerCapture(e.pointerId); } catch {}
    if (e.pointerType === "touch" || !flip.matches(":hover")) rest();
    if (!g.moved) {                                 // 只点了一下：直接翻面
      if (!cancelled) flipCard();
      return;
    }
    const here = turn.x;
    let vel = 0;                                   // 最近 90ms 的角速度（deg/s）
    const a = g.hist[0], b = g.hist[g.hist.length - 1];
    if (!cancelled && a && b && b.t > a.t && performance.now() - b.t < 60)
      vel = ((b.v - a.v) / (b.t - a.t)) * 1000;
    const to = cancelled ? snap(g.base)             // 被打断：回到拖动前的面
      : clampN(snap(here + vel * FLING), snap(here) - 180, snap(here) + 180);  // 轻弹：速度外推，最多翻一面
    settle(to, vel);
  }
  flip.addEventListener("pointerup", e => release(e, false));
  flip.addEventListener("pointercancel", e => release(e, true));
  flip.addEventListener("lostpointercapture", e => { if (grip && grip.id === e.pointerId) release(e, true); });
  flip.addEventListener("pointerenter", e => {
    if (!reduceMQ.matches && e.pointerType !== "touch") { lift.t = HOVER_SCALE; loop(); }
  });
  flip.addEventListener("pointerleave", () => { if (!grip) rest(); });
  flip.addEventListener("keydown", e => {           // 键盘：Enter / 空格翻面
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    if (!e.repeat) flipCard();
  });
  flip.addEventListener("click", e => {            // 屏蔽拖动结束后的原生 click
    if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
  }, true);
  reduceMQ.addEventListener?.("change", () => {    // 系统"减少动态"切换时优雅降级
    if (reduceMQ.matches) {
      turn.jump(target); tiltX.jump(0); tiltY.jump(0); lift.jump(1); sheen.jump(0);
      flip.style.transform = "";
    }
    syncFace(); render();
  });
  $("pvClose").addEventListener("click", close);
  $("pvBackdrop").addEventListener("click", close);
  $("pvEdit").addEventListener("click", (e) => { e.stopPropagation(); showStoryModal(openId); });
  $("pvStar").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!current) return;
    const m = current;
    close();
    setTimeout(() => memoViewer.open(m), 320);   // 换场后粒子迸发
  });

  return {
    open, close,
    currentId: () => openId,
    refresh(m) {
      if (openId !== m.id) return;
      buildBack(m);
    },
  };
})();

/* ---------- 四、3D 粒子回忆查看器 ---------- */
const memoViewer = (() => {
  const HOLD = 0.95;         // 粒子拼出照片的停留秒数
  let openId = null, state = null, raf = 0, lastT = 0;

  function buildStory(m) {
    const box = $("memoText");
    box.innerHTML = "";
    const dateP = document.createElement("p");
    dateP.className = "memo-line memo-date";
    dateP.textContent = "— " + fmtDate(m.createdAt) + " —";
    dateP.style.animationDelay = "1.1s";
    box.appendChild(dateP);
    const lines = (m.story || "").split(/\n+/).map((s) => s.trim()).filter(Boolean);
    if (!lines.length) {
      const hint = document.createElement("p");
      hint.className = "memo-line";
      hint.textContent = "这段回忆还没有故事，点击右上角 ✎ 为它写一个吧";
      hint.style.animationDelay = "1.6s";
      box.appendChild(hint);
    } else {
      const step = lines.length > 6 ? 0.55 : 1.0;
      lines.forEach((text, i) => {
        const p = document.createElement("p");
        p.className = "memo-line";
        p.textContent = text;
        p.style.animationDelay = (1.35 + i * step) + "s";
        box.appendChild(p);
      });
    }
  }

  function setup(img) {
    cancelAnimationFrame(raf);
    const cv = $("memoCanvas"), ctx = cv.getContext("2d");
    const W = innerWidth, H = innerHeight;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* 照片采样 → 粒子（约 7200 粒） */
    const MAXSIDE = 470;
    const sc = Math.min(1, MAXSIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const iw = Math.max(4, Math.round(img.naturalWidth * sc));
    const ih = Math.max(4, Math.round(img.naturalHeight * sc));
    const off = document.createElement("canvas");
    off.width = iw; off.height = ih;
    const octx = off.getContext("2d");
    octx.drawImage(img, 0, 0, iw, ih);
    const data = octx.getImageData(0, 0, iw, ih).data;
    const gap = Math.max(2, Math.round(Math.sqrt((iw * ih) / 7200)));
    const ps = [];
    for (let y = 0; y < ih; y += gap) {
      for (let x = 0; x < iw; x += gap) {
        const i = (y * iw + x) * 4;
        if (data[i + 3] < 40) continue;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        ps.push({
          x: x - iw / 2, y: y - ih / 2, z: 0,
          vx: (Math.random() - 0.5) * 95,
          vy: (Math.random() - 0.5) * 95 - 26,
          vz: 130 + Math.random() * 430,
          size: Math.max(1.6, gap * 0.92),
          c0: `rgb(${r},${g},${b})`,
          c1: `rgb(${Math.min(255, r + 45)},${Math.min(255, g + 45)},${Math.min(255, b + 45)})`,
        });
      }
    }
    state = { ctx, ps, W, H, origin: { x: W / 2, y: H * 0.4 }, t: 0 };
    lastT = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!state) return;
    const { ctx, ps, origin, W, H } = state;
    const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
    lastT = now;
    state.t += dt;
    const t = state.t;
    const burst = Math.max(0, t - HOLD);
    ctx.clearRect(0, 0, W, H);
    const rotY = burst * 0.5;
    const cosR = Math.cos(rotY), sinR = Math.sin(rotY);
    const breathe = 1 + 0.006 * Math.sin(t * 2.2);
    for (const p of ps) {
      let x, y, z, alpha, color;
      if (burst > 0) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.z += p.vz * dt;
        const rx = p.x * cosR - p.z * sinR;
        const rz = p.x * sinR + p.z * cosR;
        x = rx; y = p.y; z = rz;
        alpha = Math.max(0, 1 - z / 950);
        color = p.c1;
      } else {
        x = p.x * breathe; y = p.y * breathe; z = 0;
        alpha = 1;
        color = p.c0;
      }
      if (z > 1400 || alpha <= 0.02) continue;
      const f = 640 / (640 + z);
      const sx = origin.x + x * f;
      const sy = origin.y + y * f;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const s = Math.max(0.6, p.size * f);
      ctx.globalAlpha = alpha * (0.55 + 0.45 * f);
      ctx.fillStyle = color;
      ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(loop);
  }

  function startParticles(m) {
    const img = new Image();
    img.crossOrigin = "anonymous";   // 云端图片采样需要（GitHub Pages 同源/Supabase 放开 CORS）
    img.onload = () => { if (openId === m.id) setup(img); };
    img.onerror = () => {                       // GitHub 源失败自动回退 Supabase
      img.onerror = null;
      if (m.sbUrl && img.src !== m.sbUrl) { img.src = m.sbUrl; return; }
    };
    img.src = m.url;
  }

  function open(m) {
    openId = m.id;
    const L = $("memoLayer");
    L.hidden = false;
    document.body.classList.add("lock-scroll");
    requestAnimationFrame(() => L.classList.add("show"));
    buildStory(m);
    $("btnMemoEdit").textContent = (m.story || "").trim() ? "✎ 修改故事" : "✎ 写下这段故事";
    startParticles(m);
  }

  function close() {
    if (!openId) return;
    openId = null;
    const L = $("memoLayer");
    L.classList.remove("show");
    document.body.classList.remove("lock-scroll");
    setTimeout(() => { L.hidden = true; specularGlow.wake(); }, 480);
    cancelAnimationFrame(raf);
    state = null;
    const cv = $("memoCanvas");
    cv.width = cv.width;   // 清空画布
    $("memoText").innerHTML = "";
  }

  $("btnMemoClose").addEventListener("click", close);

  return {
    open,
    close,
    currentId: () => openId,
    refresh(m) {
      if (openId !== m.id) return;
      buildStory(m);
      $("btnMemoEdit").textContent = (m.story || "").trim() ? "✎ 修改故事" : "✎ 写下这段故事";
    },
  };
})();

function fmtCmtTime(ts) {
  const diff = Date.now() - +new Date(ts);
  if (diff < 60e3) return "刚刚";
  if (diff < 3600e3) return Math.floor(diff / 60e3) + " 分钟前";
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + " 小时前";
  return fmtDate(ts);
}

function showCommentsModal(id) {
  const m = memories.find((x) => x.id === id);
  if (!m) return;
  const modal = $("commentsModal");
  modal.dataset.id = id;
  $("cmtMeta").textContent = `${fmtDate(m.createdAt)} 上传${m.author ? " · " + m.author : ""}`;
  renderCommentsList(m);
  $("cmtText").value = "";
  modal.hidden = false;
  requestAnimationFrame(() => modal.classList.add("show"));
  setTimeout(() => $("cmtText").focus(), 150);
}

function hideCommentsModal() {
  const modal = $("commentsModal");
  modal.classList.remove("show");
  setTimeout(() => { modal.hidden = true; specularGlow.wake(); }, 320);
}

function renderCommentsList(m) {
  const list = m.comments || [];
  const box = $("cmtList");
  if (!list.length) {
    box.innerHTML = `<div class="cmt-empty">还没有人留下评论，写下第一句吧 ✦</div>`;
    return;
  }
  const me = currentUserName();
  box.innerHTML = list.map((c) => `
    <div class="cmt-item${c.author === me ? " mine" : ""}" data-cid="${c.id}">
      <div class="cmt-head">
        <span class="cmt-author">${escapeHtml(c.author || "神秘人")}</span>
        <span class="cmt-time">${fmtCmtTime(c.createdAt)}</span>
        ${c.author === me ? `<button class="cmt-del" title="删除我的评论">删除</button>` : ""}
      </div>
      <div class="cmt-text">${escapeHtml(c.text)}</div>
    </div>`).join("");
  box.querySelectorAll(".cmt-del").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const cid = btn.closest(".cmt-item").dataset.cid;
      const m2 = memories.find((x) => x.id === $("commentsModal").dataset.id);
      if (!m2) return;
      try {
        if (remoteMode()) await deleteCommentRemote(cid);
        m2.comments = (m2.comments || []).filter((c) => String(c.id) !== String(cid));
        if (!remoteMode()) await memDB.put(m2);
        renderCommentsList(m2);
        renderGrid();
      } catch (_) { toast("删除失败，请重试"); }
    });
  });
}

$("btnCmtClose").addEventListener("click", hideCommentsModal);
$("commentsModal").addEventListener("click", (e) => { if (e.target.id === "commentsModal") hideCommentsModal(); });

$("btnCmtSend").addEventListener("click", async () => {  const id = $("commentsModal").dataset.id;
  const m = memories.find((x) => x.id === id);
  if (!m) { hideCommentsModal(); return; }
  const text = $("cmtText").value.trim();
  const author = currentUserName();
  if (!text) { toast("先写点什么再发表吧"); return; }
  if (!author) { toast("登录后才能发表评论"); return; }
  const btn = $("btnCmtSend");
  btn.disabled = true;
  try {
    if (remoteMode()) {
      const row = await addCommentRemote(m.id, text);
      m.comments = [...(m.comments || []), { id: row.id, author: row.author, text: row.text, createdAt: +new Date(row.created_at) }];
    } else {
      m.comments = [...(m.comments || []), {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        author, text, createdAt: Date.now(),
      }];
      await memDB.put(m);
    }
    $("cmtText").value = "";
    renderCommentsList(m);
    renderGrid();
    toast("评论已留下 ✦");
  } catch (err) {
    toast(/PGRST205|Could not find the table|does not exist/i.test(String(err && err.message))
      ? "评论功能还没初始化，请先在 Supabase 运行评论 SQL" : "发表失败，请重试");
  } finally { btn.disabled = false; }
});

 * ============================================================ */

const loginForm = document.getElementById("loginForm");

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QBJD MUSE · 回忆收集站</title>
<meta name="theme-color" content="#120f17">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">
<!-- Supabase 浏览器 SDK（本地托管，不依赖第三方 CDN——避免国内网络访问 CDN 卡顿阻塞页面渲染） -->
<!-- GitHub 数据层：无需额外 SDK，同源静态 JSON 读取 + Contents API 写入 -->
<style>
/* ============ 基础 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #120f17;
  --card: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.14);
  --text: #ece8f6;
  --text-dim: rgba(236, 232, 246, 0.52);
  --accent-1: #a78bfa;   /* 薰衣草紫 */
  --accent-2: #f472b6;   /* 粉 */
  --accent-3: #a855f7;   /* 亮紫（AeroShards accent） */
  --radius: 22px;
}

html, body { height: 100%; }

body {
  font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============ AeroShards 碎片流背景（Canvas 2D 移植） ============ */
.aero-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.aero-bg canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}
/* 夏季星夜底色（粒子画布透明叠加） */
.aero-bg.season-summer {
  background: linear-gradient(180deg, #122036 0%, #0e1a2c 45%, #0d0b13 100%);
}
/* 春季樱夜底色（磁力环粒子画布透明叠加） */
.aero-bg.season-spring {
  background: linear-gradient(180deg, #221229 0%, #160e1d 45%, #0d0b12 100%);
}

/* 细颗粒星点（配合 AeroShards grain） */
body::after {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 26px 26px;
  pointer-events: none;
  z-index: 1;
}

/* ============ 页面布局 ============ */
.page {
  position: relative;
  z-index: 2;
  max-width: 1080px;
  margin: 0 auto;
  padding: 32px 24px 64px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

/* 顶部（仅用户区靠右） */
header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 4px 6px;
}

/* 季节切换（RubberSegment 移植：橡皮滑块 + squash 果冻回弹） */
.season-tabs {
  display: flex;
  justify-content: center;
  padding: 10px 0 0;
}
.rubber-seg {
  position: relative;
  display: inline-flex;
  padding: 3px;                      /* inset 3 */
  background: #27272a;               /* trackColor */
  border-radius: 10px;               /* radius 10 */
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.55), 0 8px 26px rgba(0,0,0,0.4);
  touch-action: none;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.rubber-seg:active { cursor: grabbing; }
.rs-item {
  position: relative;
  z-index: 1;
  flex: 1 1 0;                       /* equalSlots */
  min-width: 82px;
  padding: 11px 30px;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: 4px;
  text-indent: 4px;
  color: #fafafa;                    /* textColor */
  cursor: pointer;
  border-radius: 7px;
  transition: color 0.24s ease;
  outline: none;
}
.rs-item:focus-visible { box-shadow: 0 0 0 2px rgba(250, 250, 250, 0.4); }
.rs-item.active { color: #18181b; }   /* activeTextColor */
.rs-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: calc((100% - 6px) / 4);
  height: calc(100% - 6px);
  background: #fafafa;               /* thumbColor */
  border-radius: 7px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.5), inset 0 -2px 4px rgba(0,0,0,0.07);
  transform: translateX(var(--x, 0px)) scale(var(--sx, 1), var(--sy, 1));
  transition: transform 0.38s cubic-bezier(0.3, 1.25, 0.45, 1);
  will-change: transform;
  pointer-events: none;
}
.rs-thumb.dragging { transition: none; }

/* ============ 回忆收集站 · 主界面 ============ */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(24px) scale(0.98); }
  to   { opacity: 1; transform: none; }
}

/* 标题区 */
.mem-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  padding: 6px 6px 2px;
}
.mem-hero h2 {
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 800;
  letter-spacing: 0.5px;
  background: linear-gradient(90deg, #e4defc, #a855f7);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.mem-hero p {
  font-size: 13.5px;
  color: var(--text-dim);
  margin-top: 6px;
  letter-spacing: 1px;
}
.btn-add {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 26px;
  border: none; border-radius: 16px;
  font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 2px;
  color: #fff; cursor: pointer;
  background: linear-gradient(135deg, #a78bfa, #f472b6);
  box-shadow: 0 12px 34px rgba(167,139,250,0.42), inset 0 1px 0 rgba(255,255,255,0.35);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
}
.btn-add:hover { transform: translateY(-2px); box-shadow: 0 16px 44px rgba(244,114,182,0.5), inset 0 1px 0 rgba(255,255,255,0.35); }
.btn-add:active { transform: scale(0.97); }
.btn-cam {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 13px 20px;
  border: 1px solid rgba(255,255,255,0.28); border-radius: 16px;
  background: rgba(255,255,255,0.07);
  font-family: inherit; font-size: 14.5px; font-weight: 700; letter-spacing: 1px;
  color: var(--text); cursor: pointer;
  backdrop-filter: blur(8px);
  transition: transform 0.2s ease, background 0.25s ease;
}
.btn-cam:hover { background: rgba(255,255,255,0.13); transform: translateY(-2px); }
.btn-cam:active { transform: scale(0.97); }
.hero-actions { display: flex; align-items: center; gap: 10px; }

/* 回忆墙（毛玻璃卡片网格） */
.mem-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 26px;
}
.mem-card {
  position: relative;
  margin: 0;
  border-radius: 22px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.16);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 18px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.14);
  overflow: hidden;
  cursor: pointer;
  animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
  animation-delay: calc(var(--i, 0) * 0.055s);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s ease, border-color 0.3s ease;
}
.mem-card:hover { transform: translateY(-6px); border-color: rgba(168,85,247,0.45); box-shadow: 0 26px 64px rgba(0,0,0,0.55), 0 0 30px rgba(168,85,247,0.14), inset 0 1px 0 rgba(255,255,255,0.13); }
.mem-card .mem-thumb {
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(137,106,189,0.16), rgba(168,85,247,0.1));
}
.mem-card .mem-thumb img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
}
.mem-card:hover .mem-thumb img { transform: scale(1.05); }
.mem-card figcaption { padding: 12px 16px 14px; }
.mem-actions { display: flex; align-items: center; justify-content: space-between; }

/* ---------- PulseHeart 点赞（React Bits 组件移植：脉冲心形 + 数字滚动） ---------- */
.pulse-heart {
  display: inline-flex;
  padding: 0; border: none; background: none;
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.pulse-heart:focus-visible { outline: 2px solid rgba(255, 77, 109, 0.55); outline-offset: 3px; border-radius: var(--ph-corner, 16px); }
.ph-pill {
  --ph-liked: #ff4d6d;
  --ph-idle: #8b8b93;
  display: inline-flex; align-items: center; gap: 7px;
  height: var(--ph-size, 32px);
  padding: 0 calc(var(--ph-size, 32px) * 0.34);
  border-radius: var(--ph-corner, 16px);
  background: rgba(35, 35, 38, 0.85);
  color: #f5f5f5;
  transition: transform 0.18s ease, background 0.2s ease;
  will-change: transform;
}
.pulse-heart:hover .ph-pill { background: rgba(48, 48, 52, 0.92); }
.pulse-heart[data-pressed] .ph-pill { transform: scale(0.93); }
.ph-heart { display: grid; place-items: center; width: calc(var(--ph-size, 32px) * 0.56); height: calc(var(--ph-size, 32px) * 0.56); }
.ph-heart svg { width: 100%; height: 100%; overflow: visible; }
.ph-line { fill: none; stroke: var(--ph-idle); stroke-width: var(--ph-stroke, 2px); transition: stroke 0.25s ease; }
.ph-solid { fill: transparent; transition: fill 0.25s ease; }
.pulse-heart[data-liked="true"] .ph-line { stroke: var(--ph-liked); }
.pulse-heart[data-liked="true"] .ph-solid { fill: var(--ph-liked); }
.ph-count {
  display: inline-flex; align-items: center;
  font-size: calc(var(--ph-size, 32px) * 0.36);
  font-weight: 700; letter-spacing: 0.2px;
  font-variant-numeric: tabular-nums;
  line-height: 1; height: 1em; overflow: hidden;
}
.ph-slot { display: inline-grid; height: 1em; overflow: hidden; }
.ph-roll {
  display: grid; grid-auto-rows: 1em; line-height: 1em;
  transition: transform var(--ph-roll, 350ms) cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---------- SpecularButton 评论（React Bits 组件移植：WebGL2 流光边框） ---------- */
.specular-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; }
.specular-button {
  --sb-h: 32px;
  --sb-radius: 16px;
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: var(--sb-h);
  min-width: 60px;
  padding: 0 calc(var(--sb-h) * 0.42);
  border-radius: var(--sb-radius);
  border: 1px solid rgba(255, 255, 255, 0.10);
  background: rgba(35, 35, 38, 0.85);
  color: #f5f5f5;
  font-family: inherit; font-weight: 700;
  font-size: calc(var(--sb-h) * 0.36);
  letter-spacing: 0.2px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: transform 0.18s ease, background 0.2s ease;
}
.specular-button:hover { background: rgba(48, 48, 52, 0.92); }
.specular-button:active { transform: scale(0.94); }
.specular-button:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 3px; }
.specular-button svg { width: calc(var(--sb-h) * 0.5); height: calc(var(--sb-h) * 0.5); }
.specular-button svg path { fill: rgba(236, 232, 246, 0.85); transition: fill 0.2s ease; }
.specular-button:hover svg path { fill: #ffffff; }

/* 删除按钮 */
.mem-del {
  position: absolute; top: 10px; right: 10px;
  width: 30px; height: 30px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 13px; color: #ece8f6;
  background: rgba(18,15,23,0.62);
  backdrop-filter: blur(8px);
  cursor: pointer; opacity: 0;
  transition: opacity 0.25s ease, transform 0.2s ease, background 0.2s ease;
}
.mem-card:hover .mem-del { opacity: 0.92; }
.mem-del:hover { background: rgba(40,32,58,0.85); transform: scale(1.08); }

/* 删除确认弹窗 */
.confirm-box { text-align: center; }
.confirm-box h3 { margin-bottom: 8px; }
.confirm-text {
  font-size: 14px; line-height: 1.8;
  color: #7a7396;
  margin: 0 0 6px;
}
.confirm-warn {
  font-size: 12.5px; color: #c95c8a;
  margin-bottom: 4px;
}
.story-actions .danger {
  background: linear-gradient(135deg, #f43f5e, #e11d48);
  color: #fff;
  box-shadow: 0 10px 28px rgba(225,29,72,0.4);
}
.story-actions .danger:hover { transform: translateY(-1px); }

/* 空态 */
.mem-empty {
  text-align: center;
  padding: 70px 20px;
  color: var(--text-dim);
  font-size: 14px;
  line-height: 2.2;
  letter-spacing: 1px;
}
.mem-empty .big {
  font-size: 44px; display: block; margin-bottom: 10px;
  filter: drop-shadow(0 0 22px rgba(168,85,247,0.5));
}

footer {
  text-align: center;
  color: rgba(236,232,246,0.35);
  font-size: 12px;
  letter-spacing: 1px;
  padding-top: 8px;
}

/* ============ 照片查看器（点击放大 + 3D 翻转看故事） ============ */
.photo-viewer {
  position: fixed; inset: 0; z-index: 65;
  display: grid; place-items: center;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.photo-viewer.show { opacity: 1; }
.photo-viewer[hidden] { display: none; }
.pv-backdrop {
  position: absolute; inset: 0;
  background: rgba(13, 11, 19, 0.8);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.pv-stage {
  position: relative;
  z-index: 2;
  perspective: 1800px;
}
.pv-flip {
  position: relative;
  z-index: 1;
  transform-style: preserve-3d;
  cursor: grab;
  touch-action: pan-y;            /* 背面故事可上下滚动，水平手势留给翻面 */
  user-select: none;
  -webkit-user-select: none;
  will-change: transform;
}
.pv-flip[data-dragging] { cursor: grabbing; }
.pv-flip:focus-visible {
  outline: 2px solid rgba(168, 85, 247, 0.75);
  outline-offset: 6px;
  border-radius: 18px;
}
.pv-shadow {                       /* 地面投影：随翻转角度实时压缩变淡 */
  position: absolute;
  left: 50%; bottom: -46px;
  width: 76%; height: 36px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), rgba(0,0,0,0) 72%);
  pointer-events: none;
  will-change: transform, opacity;
}
.pv-face {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 18px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 40px rgba(168,85,247,0.12);
}
.pv-face::after {                  /* 悬停光斑：高光跟随指针移动 */
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at var(--fc-gx, 50%) var(--fc-gy, 50%),
              rgba(255,255,255,0.22), rgba(255,255,255,0) 55%);
  opacity: var(--fc-sheen, 0);
  pointer-events: none;
}
.pv-face.pv-front {
  overflow: hidden;
  background: rgba(255,255,255,0.04);
}
.pv-face.pv-front img {
  display: block;
  width: 100%; height: 100%;
  object-fit: contain;
}
.pv-face.pv-back {
  position: absolute; inset: 0;
  transform: rotateY(180deg);
  background: rgba(24, 20, 34, 0.88);
  border: 1px solid rgba(255,255,255,0.14);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  display: flex; flex-direction: column;
  padding: 26px 28px;
  box-sizing: border-box;
  overflow: hidden;
}
.pv-flip[data-face="front"] .pv-front { transition: filter 0.3s ease; }
.pv-flip[data-face="front"]:hover .pv-front { filter: brightness(1.06); }
@media (prefers-reduced-motion: reduce) {  /* 系统减少动态偏好：无 3D，改为淡入淡出换面 */
  .pv-flip { transform: none !important; }
  .pv-face { transition: opacity 0.25s ease; }
  .pv-flip[data-face="front"] .pv-back { opacity: 0; }
  .pv-flip[data-face="back"] .pv-front { opacity: 0; }
  .pv-shadow { transform: translateX(-50%) scaleX(1) !important; opacity: 0.85 !important; }
}
.pv-date {
  font-size: 12px;
  letter-spacing: 3px;
  color: rgba(236,232,246,0.5);
  text-align: center;
  margin-bottom: 14px;
  flex: none;
}
.pv-story {
  flex: 1;
  overflow-y: auto;
  font-size: clamp(14.5px, 1.5vw, 17px);
  line-height: 2;
  color: #ece8f6;
  text-align: center;
  white-space: pre-wrap;
  word-break: break-word;
  padding: 2px 6px;
}
.pv-story .pv-empty-story {
  color: rgba(236,232,246,0.42);
  font-size: 0.92em;
  line-height: 1.9;
}
.pv-story::-webkit-scrollbar { width: 5px; }
.pv-story::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.35); border-radius: 3px; }
.pv-edit {
  flex: none;
  margin-top: 16px;
  align-self: center;
  padding: 10px 24px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  background: rgba(255,255,255,0.07);
  color: #ece8f6;
  font-family: inherit; font-size: 13.5px; font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}
.pv-edit:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }
.pv-hint {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  bottom: 11vh;
  font-size: 12.5px;
  letter-spacing: 2px;
  color: rgba(236,232,246,0.55);
  text-shadow: 0 1px 10px rgba(0,0,0,0.6);
  z-index: 3;
  animation: pvHint 2.6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes pvHint {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 0.95; }
}
.pv-btn {
  position: absolute;
  padding: 10px 18px;
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 999px;
  background: rgba(24, 20, 34, 0.72);
  backdrop-filter: blur(10px);
  color: #ece8f6;
  font-family: inherit; font-size: 13px; font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  z-index: 3;
  box-shadow: 0 8px 26px rgba(0,0,0,0.45);
  transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.25s ease;
}
.pv-btn:hover { background: rgba(40, 32, 58, 0.9); transform: translateY(-1px); box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 0 22px rgba(168,85,247,0.25); }
.pv-close { top: 24px; right: 26px; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
.pv-star { top: 24px; right: 84px; }

/* ============ 回忆查看器（3D 粒子 + 故事浮现） ============ */
.memo-layer {
  position: fixed; inset: 0; z-index: 60;
  background: radial-gradient(circle at 50% 32%, rgba(255,255,255,0.93), rgba(233,228,247,0.9));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  opacity: 0;
  transition: opacity 0.5s ease;
  overflow: hidden;
}
.memo-layer.show { opacity: 1; }
.memo-layer[hidden] { display: none; }
.memo-layer canvas { position: absolute; inset: 0; }
.memo-text {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  bottom: 9vh;
  width: min(660px, 86vw);
  text-align: center;
  z-index: 2;
}
.memo-line {
  font-size: clamp(15px, 1.6vw, 18px);
  color: #3a3550;
  line-height: 1.95;
  text-shadow: 0 1px 12px rgba(255,255,255,0.9), 0 0 26px rgba(255,255,255,0.65);
  opacity: 0;
  animation: memoLine 1.25s cubic-bezier(0.22,1,0.36,1) both;
}
.memo-line.memo-date { font-size: 12.5px; letter-spacing: 3px; color: rgba(74,68,96,0.62); }
@keyframes memoLine {
  from { opacity: 0; transform: translateY(20px); filter: blur(7px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}
.memo-btn {
  position: absolute;
  padding: 10px 18px;
  border: 1px solid rgba(255,255,255,0.85);
  border-radius: 999px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  color: #3a3550;
  font-family: inherit; font-size: 13px; font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  z-index: 3;

  padding: 14px 16px;
  font-family: inherit; font-size: 14.5px;

/* 评论弹窗（复用故事弹窗玻璃风）：每条评论带作者署名 */
.cmt-box { display: flex; flex-direction: column; max-height: min(640px, calc(100vh - 48px)); }

.cmt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.cmt-author { font-size: 12px; font-weight: 700; color: #6d5cc7; letter-spacing: 0.4px; }
.cmt-time { font-size: 11px; color: #a29ec0; }
.cmt-del { margin-left: auto; border: none; background: none; color: #c95c8a; font-size: 11.5px; cursor: pointer; opacity: 0.75; font-family: inherit; }

.cmt-text { font-size: 14px; color: #3a3550; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.cmt-empty { text-align: center; color: #a29ec0; font-size: 13px; padding: 18px 0; }

.cmt-input .primary { padding: 10px 18px; border: none; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #a78bfa, #f472b6); color: #fff; box-shadow: 0 10px 28px rgba(167,139,250,0.4); white-space: nowrap; transition: transform 0.2s ease; }
.cmt-input .primary:hover { transform: translateY(-1px); }

@media (max-width: 520px) {
  .cmt-input { flex-direction: column; align-items: stretch; }

/* toast（深色玻璃，深浅两版页面通用） */
.toast {

  transform: translateX(-50%) translateY(20px);
  background: rgba(24, 20, 34, 0.9);
  border: 1px solid rgba(168, 85, 247, 0.35);
  backdrop-filter: blur(12px);
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 13.5px;
  color: #ece8f6;

  z-index: 99;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 24px rgba(168,85,247,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ 登录层（注视视频背景） ============ */
.login-layer {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;

  opacity: 1;
  transition: opacity 0.7s ease;
}
.login-layer.leaving { opacity: 0; pointer-events: none; }
.login-layer.hidden { display: none; }

/* QBJD MUSE TrueFocus（词轮流聚焦：浅蓝粒子环绕点亮，其余模糊） */
.brand-title {
  position: absolute;
  top: 5vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 0.3em;
  font-weight: 800;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
}
.brand-title .focus-word {
  position: relative;
  z-index: 10;
  color: #ffffff;
  padding: 0.06em 0.14em;
  filter: blur(5px);
  transition: filter 0.5s ease;
  text-shadow: 0 2px 16px rgba(52, 68, 128, 0.35);
}
.brand-title .focus-word.active { filter: blur(0px); }
/* 浅蓝粒子：聚焦词明亮呼吸，失焦词极淡朦胧 */
.brand-title .fp {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(224, 242, 254, 0.95), rgba(125, 211, 252, 0.3));
  box-shadow: 0 0 7px rgba(125, 211, 252, 0.6);
  opacity: 0.1;
  pointer-events: none;
  transition: opacity 0.5s ease;
  animation: fpDrift var(--dur, 7s) ease-in-out infinite alternate, fpTwinkle 3.2s ease-in-out infinite;
  animation-delay: var(--del, 0s);
}
.brand-title .focus-word.active .fp { opacity: var(--o, 0.8); }
@keyframes fpDrift {
  from { transform: translate(0, 0); }
  to   { transform: translate(var(--dx, 6px), var(--dy, -6px)); }
}
@keyframes fpTwinkle {
  0%, 100% { filter: brightness(1); }
  50%      { filter: brightness(1.7); }
}
/* 矮视口：标题位置上移，避免压到登录卡片 */
@media (max-height: 800px) {
  .brand-title { top: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .brand-title .focus-word { transition: none; }
  .brand-title .fp { animation: none; }
  .login-orb { animation: none; }
}

.login-video {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.login-video video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
}

/* 登录卡片与圆形按钮：同格叠放切换，均正中居中 */

/* 登录卡片（初始隐藏，点圆形按钮后居中浮出） */
.login-card, .login-orb { grid-area: 1 / 1; }
.login-card {
  position: relative;
  z-index: 2;
  width: min(400px, calc(100vw - 40px));
  padding: 42px 38px 36px;
  border-radius: 26px;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 24px 70px rgba(139, 124, 195, 0.35), inset 0 1px 0 rgba(255,255,255,0.9);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(26px) scale(0.96);
  transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.55s;
}
.login-card.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: none;
  transition: opacity 0.55s ease 0.12s, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.12s, visibility 0s;
}

/* 圆形登录按钮（初始态：正中央，点击后浮出登录框） */
.login-orb {
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
  animation: orbFloat 3.5s ease-in-out infinite, orbIn 0.9s ease both;
}
.login-orb.gone {
  animation: none;
  transform: scale(1.35);
  opacity: 0;
  pointer-events: none;
}
@keyframes orbFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
@keyframes orbIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
/* 3D 透明玻璃球（无字，背景角色可透过） */
.orb-core {
  position: relative;
  width: clamp(132px, 16vw, 184px);
  height: clamp(132px, 16vw, 184px);
  border-radius: 50%;
  background:
    radial-gradient(circle at 33% 27%, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.55) 9%, rgba(255, 255, 255, 0.14) 22%, transparent 36%),
    radial-gradient(circle at 70% 84%, rgba(125, 211, 252, 0.5) 0%, rgba(56, 189, 248, 0.16) 28%, transparent 48%),
    radial-gradient(circle at 50% 120%, rgba(255, 255, 255, 0.5) 0%, transparent 44%),
    linear-gradient(160deg, rgba(255, 255, 255, 0.18) 0%, rgba(186, 230, 253, 0.05) 100%);
  backdrop-filter: blur(9px) saturate(1.25) brightness(1.05);
  -webkit-backdrop-filter: blur(9px) saturate(1.25) brightness(1.05);
  border: 1px solid rgba(255, 255, 255, 0.78);
  box-shadow:
    inset 0 3px 2px rgba(255, 255, 255, 0.95),
    inset 0 -30px 48px rgba(2, 132, 199, 0.24),
    inset 9px 0 22px rgba(255, 255, 255, 0.18),
    inset -9px 0 22px rgba(255, 255, 255, 0.14),
    0 20px 50px rgba(125, 211, 252, 0.3),
    0 0 0 10px rgba(255, 255, 255, 0.12);
  transition: transform 0.25s ease, box-shadow 0.3s ease;
}
.orb-core::before {
  content: "";
  position: absolute;
  left: 22%;
  top: 16%;
  width: 30%;
  height: 15%;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255, 255, 255, 0.95) 0%, transparent 72%);
  transform: rotate(-25deg);
  filter: blur(1px);
}
.login-orb:hover .orb-core {
  transform: scale(1.05);
  box-shadow:
    inset 0 3px 2px rgba(255, 255, 255, 1),
    inset 0 -30px 48px rgba(2, 132, 199, 0.3),
    inset 9px 0 22px rgba(255, 255, 255, 0.24),
    inset -9px 0 22px rgba(255, 255, 255, 0.2),
    0 24px 60px rgba(125, 211, 252, 0.42),
    0 0 0 14px rgba(255, 255, 255, 0.18);
}
.login-orb:active .orb-core { transform: scale(0.95); }
